# WunderkindLC — prod: app (API + SPA) + PostgreSQL + nginx (TLS) + kunlik backup.
# Bitta o'quv markazi (multi-tenant YO'Q). Sozlamalar .env faylidan keladi (.env.example dan nusxa oling).
# Diqqat: app porti TASHQARIGA OCHILMAGAN — unga faqat nginx (ichki tarmoq) kiradi.
# Public IP'ga o'tish rejasi: PUBLIC-IP-OTISH.md (nginx + Cloudflare Origin Cert + ufw firewall).
# PostgreSQL yengil — 1GB RAM serverga ham sig'adi (SQL Server >=2GB talab qilardi).

services:
  postgres:
    image: postgres:16-alpine
    container_name: wunderkindlc-postgres
    # Sozlamalar PROD SERVER (Contabo, 4 yadro / 7.8 GB RAM, 2026-08 ko'chirilgan) uchun:
    #   shared_buffers 1GB        — RAM'ning ~12%; app + boshqa konteynerlar bilan bo'lishiladi
    #   effective_cache_size 3GB  — rejalashtiruvchiga OS fayl keshi haqida maslahat (xotira band qilmaydi);
    #                               kichik qiymat plannerni indeks o'rniga seq scan tanlashga undardi
    #   work_mem 16MB             — sort/hash uchun; max_connections=50 bilan birga xavfsiz chegara
    #   maintenance_work_mem 128MB— VACUUM / indeks qurish tezlashadi
    #   max_connections 50        — bitta app + backup uchun yetarli; har ulanish xotira yeydi
    #   random_page_cost 1.1      — SSD disk (default 4.0 HDD uchun edi)
    #   log_min_duration_statement 500 — 500ms dan sekin so'rovlar logda ko'rinsin (diagnostika)
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
    # Parallel so'rovlar /dev/shm dan foydalanadi — docker default 64MB tor edi.
    shm_size: 512mb
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-wunderkindlc}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-wunderkindlc}"
    volumes:
      - postgres-data:/var/lib/postgresql/data   # baza shu volume'da (deploylar oralig'ida saqlanadi)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wunderkindlc} -d ${POSTGRES_DB:-wunderkindlc}"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      args:
        VITE_ROOT_DOMAIN: "${ROOT_DOMAIN}"   # frontend domenni shu qiymatga nisbatan aniqlaydi
        VITE_USE_MOCK: "false"
        VITE_POSTHOG_KEY: "${VITE_POSTHOG_KEY:-}"
        VITE_POSTHOG_HOST: "${VITE_POSTHOG_HOST:-}"
    container_name: wunderkindlc-app
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      # ⚠️ Pool chegarasi ATAYIN aniq yozilgan. Npgsql standarti — 100, Postgres esa yuqorida
      # max_connections=50 bilan ishga tushadi: yuklama ostida app 50 dan oshirishga urinib,
      # "FATAL: sorry, too many clients already" olardi (sekinlik emas, QATTIQ xato). 30 —
      # backup konteyneri va superuser zaxirasiga joy qoldiradi.
      # Minimum Pool Size=2 — tanaffusdan keyingi birinchi so'rov sovuq ulanish (TCP+SCRAM auth)
      # ochmasin. SSL Mode=Disable — postgres konteynerida `ssl=off` (tekshirilgan), ya'ni
      # standart "Prefer" har ulanishda SSL so'rab, rad javobini bekorga kutardi.
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-wunderkindlc};Username=${POSTGRES_USER:-wunderkindlc};Password=${POSTGRES_PASSWORD};Maximum Pool Size=30;Minimum Pool Size=2;SSL Mode=Disable"
      Tenancy__RootDomain: "${ROOT_DOMAIN}"
      App__Host: "${APP_HOST}"             # FAQAT shu host ilovani (SPA) ochadi; qolganlari -> landing
      Jwt__Key: "${JWT_KEY}"               # >=32 belgi; prod'da MAJBURIY
      # AI Tahlil (Gemini) modeli (kalit ham shu yerdan — pastda Gemini__ApiKey).
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.1-flash-lite}"
      # ====== Integratsiyalar ======
      # MAXFIY qiymatlar (token/parol/API kalit/service account) FAQAT shu yerdan o'qiladi —
      # ular bazada saqlanmaydi va UI'dan kiritilmaydi (backend: AppSecrets). Maxfiy BO'LMAGAN
      # sozlamalar (bot nomi, kanal, turniket IP, bayroqlar, soatlar) ENV-WINS: berilsa har
      # deploy'da DB'ga qo'llanadi, bo'sh qoldirilsa UI (Sozlamalar)dan boshqariladi.
      # Telegram bot (BotToken — MAXFIY):
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN:-}"
      Telegram__BotUsername: "${TELEGRAM_BOT_USERNAME:-}"
      Telegram__BotName: "${TELEGRAM_BOT_NAME:-}"
      Telegram__Channel: "${TELEGRAM_CHANNEL:-}"
      Telegram__AdminChatId: "${TELEGRAM_ADMIN_CHAT_ID:-}"
      # Karyera boti (Wunderkind Career — ishga qabul; ALOHIDA bot, token MAXFIY).
      # MiniAppUrl bo'sh bo'lsa APP_HOST'dan yasaladi: https://<APP_HOST>/vakansiya
      Career__BotToken: "${CAREER_BOT_TOKEN:-}"
      Career__MiniAppUrl: "${CAREER_MINIAPP_URL:-}"
      # Push (Firebase) — service account JSON (MAXFIY, bir qatorli):
      Fcm__ServiceAccountJson: "${FCM_SERVICE_ACCOUNT_JSON:-}"
      # AI Tahlil (Gemini) kaliti (MAXFIY):
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      # Speaking (Azure) — kalit MAXFIY, region ham env'dan:
      Azure__SpeechKey: "${AZURE_SPEECH_KEY:-}"
      Azure__SpeechRegion: "${AZURE_SPEECH_REGION:-}"
      # SMS (Eskiz.uz) — login/parol MAXFIY; From (sender) maxfiy emas:
      Eskiz__Email: "${ESKIZ_EMAIL:-}"
      Eskiz__Password: "${ESKIZ_PASSWORD:-}"
      # From (jo'natuvchi nomi) UI'dan boshqariladi — default QO'YILMAYDI, aks holda har
      # deployda admin tanlagan tasdiqlangan nikname "4546" ga qaytib ketardi.
      Eskiz__From: "${ESKIZ_FROM:-}"
      # Turniket / FaceID — Username/Password MAXFIY, qolgani UI'dan ham sozlanadi:
      Turnstile__Enabled: "${TURNSTILE_ENABLED:-}"
      Turnstile__Vendor: "${TURNSTILE_VENDOR:-}"
      Turnstile__Host: "${TURNSTILE_HOST:-}"
      Turnstile__Port: "${TURNSTILE_PORT:-}"
      Turnstile__Username: "${TURNSTILE_USERNAME:-}"
      Turnstile__Password: "${TURNSTILE_PASSWORD:-}"
      # Call Center — MoiZvonki (bulutli telefoniya: operator telefonidagi ilova + SIM).
      # Webhook avto-obuna APP_HOST orqali.
      MoiZvonki__Enabled: "${MOIZVONKI_ENABLED:-false}"
      MoiZvonki__Domain: "${MOIZVONKI_DOMAIN:-}"
      MoiZvonki__UserName: "${MOIZVONKI_USERNAME:-}"
      MoiZvonki__ApiKey: "${MOIZVONKI_API_KEY:-}"
      MoiZvonki__WebhookSecret: "${MOIZVONKI_WEBHOOK_SECRET:-}"
      # Instagram AI agenti (Marketing) — ikkalasi ham MAXFIY. Bo'sh bo'lsa modul FAIL-CLOSED:
      # Meta'ning webhook tasdig'i ham (GET), hodisalari ham (POST) 403 bilan rad etiladi.
      # Qolgan Instagram sozlamalari (App ID, bayroqlar) — bazada, UI'dan. marketing-instagram.md §7.
      Instagram__AppSecret: "${INSTAGRAM_APP_SECRET:-}"
      Instagram__VerifyToken: "${INSTAGRAM_VERIFY_TOKEN:-}"
      # REKLAMA LIDLARI (Meta Lead Ads) — `leadgen` webhook'i FACEBOOK PAGE obyektidan keladi,
      # ya'ni boshqa Meta ilovasida bo'lishi MUMKIN. Bo'sh qoldirilsa yuqoridagi Instagram
      # kalitlariga qaytadi (bitta ilova ishlatilganda hech narsa qo'shish shart emas).
      Meta__AppSecret: "${META_APP_SECRET:-}"
      Meta__VerifyToken: "${META_VERIFY_TOKEN:-}"
      # YUZ BILAN KIRISH — vektorlarni bazada shifrlash kaliti (MAXFIY, base64 32 bayt).
      # Bo'sh bo'lsa modul UMUMAN ishlamaydi (startupda ogohlantirish logi). DEPLOY.md §2.1.
      Face__VectorKey: "${FACE_VECTOR_KEY:-}"
      # Ilova haqiqiyligi (Google Play Integrity). SA JSON bo'sh bo'lsa FCM'niki zaxira sifatida
      # ishlatiladi. Bo'sh qoldirilsa tekshiruv "notConfigured" — kirishga to'siq BO'LMAYDI.
      PlayIntegrity__ServiceAccountJson: "${PLAY_INTEGRITY_SA_JSON:-}"
      PlayIntegrity__Package: "${PLAY_INTEGRITY_PACKAGE:-}"
      # Kamera / to'lov eslatmasi / kunlik AI tahlil / backup (yoqish-o'chirish + vaqt):
      Camera__Enabled: "${CAMERA_ENABLED:-}"
      # 24/7 diskka YOZIB borish. Bo'sh -> bazadagi qiymat (default O'CHIQ).
      # ⚠️ Yoqishdan oldin disk hisobini qiling: 1080p kamera ~20-43 GB/kun (.claude/rules/cameras.md).
      Camera__RecordEnabled: "${CAMERA_RECORD_ENABLED:-}"
      # NVR (videoregistrator) arxivi — orqaga qaytarish NVR'dan olinadi, bizda yozilmaydi.
      Nvr__Enabled: "${NVR_ENABLED:-}"
      Nvr__Host: "${NVR_HOST:-}"
      Nvr__RtspPort: "${NVR_RTSP_PORT:-}"
      Nvr__IsapiPort: "${NVR_ISAPI_PORT:-}"
      Nvr__Vendor: "${NVR_VENDOR:-}"
      Nvr__Username: "${NVR_USERNAME:-}"
      Nvr__Password: "${NVR_PASSWORD:-}"
      PaymentReminders__Enabled: "${PAYMENT_REMINDERS_ENABLED:-}"
      AiAnalysis__Enabled: "${AI_ANALYSIS_ENABLED:-}"
      AiAnalysis__Hour: "${AI_ANALYSIS_HOUR:-}"
      Backup__TelegramEnabled: "${BACKUP_TELEGRAM_ENABLED:-}"
      Backup__Hour: "${BACKUP_HOUR:-}"
      Backup__Minute: "${BACKUP_MINUTE:-}"
      # Birinchi ishga tushishda (baza bo'sh bo'lsa) shu login/parol bilan super admin yaratiladi.
      Seed__OwnerLogin: "${OWNER_LOGIN:-admin}"
      Seed__OwnerPassword: "${OWNER_PASSWORD}"
      # EF Core migratsiya retry'lari — 1GB RAM server'da startup sekin bo'lishi mumkin
      DOTNET_SYSTEM_NET_SOCKETS_INLINE_OPERATIONS: "true"
    volumes:
      - uploads:/app/uploads               # yuklangan fayllar (rasm, hujjat)
      - dpkeys:/app/keys                   # DataProtection kalitlari — deploylar oralig'ida saqlanadi
      # CTI (Local Call) audio yozuvlari — ATAYIN /uploads (ochiq statik) ostida EMAS,
      # faqat autentifikatsiyalangan /api/cti/calls/{id}/audio orqali beriladi.
      - cti-recordings:/app/recordings
    depends_on:
      postgres:
        condition: service_healthy
    # /api/health mavjud endpoint (Program.cs). Konteynerda curl/wget YO'Q (aspnet:8.0 Debian
    # bazasi), shuning uchun bash'ning /dev/tcp orqali HTTP 200 tekshiriladi — Dockerfile'ga
    # tegilmadi. start_period 90s: kichik serverda startup (EF migratsiyalari) sekin bo'lishi mumkin.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -c 200 <&3 | grep -q \" 200 \"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Diqqat: bu yerda `ports:` YO'Q — internetga ochilmaydi (faqat nginx kiradi).

  # Kamera media-shlyuzi: IP kameralar RTSP oqimini brauzer ko'radigan HLS ga o'giradi.
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: wunderkindlc-mediamtx
    environment:
      MTX_API: "yes"
      MTX_HLS: "yes"
      MTX_PLAYBACK: "yes"
      MTX_HLSVARIANT: "mpegts"
      MTX_PATHDEFAULTS_RECORDPATH: "/recordings/%path/%Y-%m-%d_%H-%M-%S-%f"
    volumes:
      - cam-recordings:/recordings
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # TLS terminatsiya — Cloudflare Origin Certificate bilan (public IP rejimi).
  # Sertifikat serverda /root/certs (origin.pem + origin.key) — PUBLIC-IP-OTISH.md 1-qadam.
  # ⚠️ HOST 443 BAND — u serverdagi xray (shaxsiy VPN)niki, unga TEGILMAYDI.
  # Shuning uchun nginx hostda 8443 da turadi (konteyner ichida baribir 443);
  # Cloudflare tomonda Origin Rule 443→8443 port rewrite qiladi — tashrifchi uchun
  # hech narsa o'zgarmaydi (PUBLIC-IP-OTISH.md 4-qadam).
  # 80/8443 portlarni faqat firewall skripti (infra/cloudflare-firewall.sh) ishga
  # tushirilgandan KEYIN oching — u portlarni FAQAT Cloudflare IP'lariga cheklaydi.
  nginx:
    image: nginx:1.27-alpine
    container_name: wunderkindlc-nginx
    ports:
      - "80:80"          # 80 bo'sh (xray faqat 443 da) — Cloudflare http so'rovlari uchun
      - "8443:443"       # host 8443 -> konteyner 443 (host 443 = xray)
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /root/certs:/etc/nginx/certs:ro     # Cloudflare Origin Cert (serverda yaratiladi)
    depends_on:
      app:
        condition: service_healthy          # app tayyor bo'lmaguncha 502 bermasin
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Kunlik backup — Postgres dump (.sql.gz) + FAYL volume'lari (uploads + CTI audio, .tar.gz).
  # Ixtiyoriy: SHIFRLASH (BACKUP_ENCRYPT_PASSPHRASE -> .gpg) va OFF-SITE nusxa (RCLONE_REMOTE ->
  # S3/R2/Google Drive va h.k.). Ikkalasi ham bo'sh bo'lsa — faqat lokal (eski xatti-harakat).
  # DIQQAT (falokatdan tiklanish): faqat lokal backup xavfli — disk/server yo'qolsa baza+backup birga
  # yo'qoladi. Off-site (3-2-1 qoidasi) va shifrlashni yoqing — batafsil DEPLOY.md.
  backup:
    image: postgres:16-alpine
    container_name: wunderkindlc-backup
    environment:
      PGHOST: postgres
      PGUSER: "${POSTGRES_USER:-wunderkindlc}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB:-wunderkindlc}"
      BACKUP_HOUR: "${BACKUP_HOUR:-21}"        # Soat (UTC). 21 = 02:00 Toshkent (kechasi). .env'dan o'zgartiriladi.
      BACKUP_MINUTE: "${BACKUP_MINUTE:-0}"     # Daqiqa (UTC). Masalan 30 -> 21:30 UTC. .env'dan o'zgartiriladi.
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"     # kundan eski LOKAL nusxalar o'chiriladi
      # Ixtiyoriy — SHIFRLASH: bo'sh bo'lmasa har nusxa gpg (AES-256) bilan shifrlanadi (.gpg).
      # Tiklashda shu parol kerak — uni XAVFSIZ (parol menejeri) saqlang, serverda EMAS!
      BACKUP_ENCRYPT_PASSPHRASE: "${BACKUP_ENCRYPT_PASSPHRASE:-}"
      # Ixtiyoriy — OFF-SITE: rclone remote (masalan "r2:wunderkindlc-backups"). Bo'sh -> off-site yo'q.
      RCLONE_REMOTE: "${RCLONE_REMOTE:-}"
      RCLONE_CONFIG: "/config/rclone.conf"
    volumes:
      - postgres-backups:/backups
      - uploads:/data/uploads:ro                # yuklangan fayllar (rasm/hujjat) — o'qish uchun
      - cti-recordings:/data/recordings:ro      # CTI audio yozuvlari — o'qish uchun
      - ./backup-config:/config:ro              # ixtiyoriy: rclone.conf (off-site uchun). Bo'sh bo'lsa — e'tiborsiz.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        RET="$${BACKUP_RETENTION_DAYS:-7}"; ENC="$${BACKUP_ENCRYPT_PASSPHRASE:-}"; REMOTE="$${RCLONE_REMOTE:-}"
        # Kerakli vositalarni FAQAT sozlangan bo'lsa o'rnatamiz (shifr -> gnupg, off-site -> rclone).
        if [ -n "$$ENC" ] || [ -n "$$REMOTE" ]; then
          apk add --no-cache gnupg rclone >/dev/null 2>&1 || echo "[backup] OGOHLANTIRISH: vosita o'rnatilmadi (tarmoq?)"
        fi
        bm=$$(printf '%02d' "$${BACKUP_MINUTE:-0}" 2>/dev/null || echo "$${BACKUP_MINUTE}")
        echo "[backup] xizmat: har kuni $${BACKUP_HOUR:-21}:$$bm UTC | lokal saqlash $$RET kun | shifr: $$([ -n "$$ENC" ] && echo ON || echo OFF) | off-site: $$([ -n "$$REMOTE" ] && echo "$$REMOTE" || echo OFF)"
        last=""
        while true; do
          H=$$(date -u +%H); M=$$(date -u +%M); D=$$(date -u +%Y%m%d)
          now=$$(( 10#$$H * 60 + 10#$$M ))
          target=$$(( 10#$${BACKUP_HOUR:-21} * 60 + 10#$${BACKUP_MINUTE:-0} ))
          if [ "$$last" != "$$D" ] && [ "$$now" -ge "$$target" ] && [ "$$now" -lt "$$(( target + 10 ))" ]; then
            last="$$D"; ts=$$(date -u +%Y%m%d_%H%M)
            db="/backups/wunderkindlc_$${ts}.sql.gz"; files="/backups/wunderkindlc_$${ts}_files.tar.gz"
            echo "[backup] $$ts — baza dump..."
            pg_dump | gzip > "$$db" || { echo "[backup] XATO: pg_dump"; rm -f "$$db"; }
            echo "[backup] $$ts — fayllar (uploads + cti audio, uploads/face TASHQARIDA)..."
            # ⚠️ `uploads/face` ISTISNO: yuz bilan kirish selfilari — BIOMETRIK ma'lumot va
            # ustiga voyaga yetmaganlarniki. Bu arxiv off-site'ga/Telegram'ga chiqishi mumkin,
            # shuning uchun selfilar unga UMUMAN qo'shilmaydi. (Yuz VEKTORLARI bazada, lekin
            # ular AES-GCM bilan shifrlangan — kalit faqat .env da, dump'da yo'q.)
            # Selfilar baribir vaqtinchalik: CenterMeta.LoginFaceKeepChecks dan oshgani o'chadi.
            tar czf "$$files" --exclude='uploads/face' --exclude='uploads/face/*' -C /data uploads recordings 2>/dev/null || { echo "[backup] OGOHLANTIRISH: fayllar tar xato"; rm -f "$$files"; }
            # Shifrlash (parol berilgan bo'lsa) — natija .gpg, asl fayl o'chiriladi.
            if [ -n "$$ENC" ]; then
              for f in "$$db" "$$files"; do
                [ -f "$$f" ] || continue
                if gpg --batch --yes --passphrase "$$ENC" -c "$$f"; then rm -f "$$f"; else echo "[backup] XATO: shifrlash $$f"; fi
              done
            fi
            # Off-site nusxa (rclone remote berilgan bo'lsa).
            if [ -n "$$REMOTE" ]; then
              if rclone copy /backups "$$REMOTE" --include "wunderkindlc_$${ts}*" --transfers 2 2>&1; then
                echo "[backup] off-site OK -> $$REMOTE"
              else
                echo "[backup] XATO: off-site nusxa ($$REMOTE)"
              fi
            fi
            find /backups -name 'wunderkindlc_*' -type f -mtime +$$RET -delete
            echo "[backup] $$ts tugadi."
          fi
          sleep 60
        done

volumes:
  postgres-data:
  postgres-backups:
  uploads:
  dpkeys:
  cam-recordings:
  cti-recordings:
