# ============================================================================
# IntellectCRM — nginx (TLS terminatsiya, Cloudflare Origin Certificate bilan).
#
# Rejim: Cloudflare (proxied, "to'q sariq bulut") -> shu nginx (443) -> app:8080.
# Sertifikat — CF dashboard'dan yaratilgan Origin Certificate (15 yillik), u FAQAT
# Cloudflare <-> server orasida ishlaydi (brauzer unga bevosita ishonmaydi) — shuning
# uchun DNS hech qachon "DNS only" (kulrang bulut) qilinmasligi kerak.
# Fayllar konteynerga volume orqali kiradi: /etc/nginx/certs/origin.pem + origin.key
# (docker-compose.yml -> nginx servisi; serverda /root/certs papkasi).
#
# Ikkala domen (intellectschool.uz — landing, crm.intellectschool.uz — CRM SPA) BITTA
# app konteyneriga boradi: hostga qarab ajratishni APP O'ZI qiladi (Program.cs:
# apex/www -> landing.html, App__Host -> SPA). Shuning uchun bu yerda bitta server blok.
#
# mediamtx (kamera HLS) TASHQARIGA CHIQMAYDI — app uni /api/admin/cameras/... orqali
# o'zi proksilaydi (CameraGateway). Bu yerda unga alohida marshrut KERAK EMAS.
# ============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout 65;

    # GZIP ATAYIN YO'Q: app o'zi siqadi (Program.cs -> AddResponseCompression /
    # UseResponseCompression). Nginx'da yana yoqish CPU'ni ikki marta ishlatardi,
    # foyda esa nol — app'dan kelayotgan javob allaqachon siqilgan.
    gzip off;

    # Yuklash chegarasi — app'dagi ENG KATTA endpoint'ga mos:
    #   Instagram Reels video: IgPublishConst.MaxReelsBytes = 1 GiB (Meta chegarasi)
    #   (qolganlari kichik: APK 50MB, CTI audio 50MB, hujjatlar 8-20MB).
    # 1100m = 1 GiB + multipart sarlavhalari uchun zaxira. Aniq chegarani baribir
    # app o'zi tekshiradi ([RequestSizeLimit]) — bu yerda faqat undan KICHIK bo'lmasligi muhim.
    client_max_body_size 1100m;

    # Katta yuklamalarni diskka bufferlamasdan to'g'ri app'ga oqizamiz —
    # aks holda 1GB video avval nginx diskiga yozilib, keyin app'ga yuborilardi.
    proxy_request_buffering off;

    # WebSocket upgrade: Upgrade sarlavhasi bo'lsa -> "upgrade", bo'lmasa oddiy so'rov.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # REAL MIJOZ IP'SI: biz Cloudflare ORTIDAmiz, ya'ni $remote_addr = Cloudflare
    # edge serveri. Haqiqiy mijoz IP'sini Cloudflare `CF-Connecting-IP` sarlavhasida
    # yuboradi — X-Forwarded-For'ga AYNAN SHUNI qo'yamiz. App tomonda
    # UseForwardedHeaders (XForwardedFor|XForwardedProto, KnownProxies tozalangan)
    # uni o'qiydi va RemoteIpAddress to'g'ri bo'ladi.
    # Firewall 80/443'ni FAQAT Cloudflare IP'lariga ochgani uchun bu sarlavhani
    # begona soxtalashtira olmaydi (infra/cloudflare-firewall.sh).
    map $http_cf_connecting_ip $client_real_ip {
        default $http_cf_connecting_ip;
        ''      $remote_addr;   # to'g'ridan-to'g'ri (masalan lokal sinov) kelganda
    }

    # Docker ichki DNS: app konteyneri qayta yaratilsa (deploy) IP o'zgaradi —
    # resolver + o'zgaruvchi orqali nginx nomni har 10 soniyada qayta hal qiladi,
    # aks holda nginx eski IP'ni ushlab qolib 502 berardi (restart kerak bo'lardi).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- 80: hammasi HTTPS'ga ----
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- 443: TLS + proxy -> app ----
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name intellectschool.uz www.intellectschool.uz crm.intellectschool.uz;

        # Cloudflare Origin Certificate (PUBLIC-IP-OTISH.md 1-qadam).
        # Ikkala domen bitta sertifikatda (*.intellectschool.uz + intellectschool.uz).
        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        # Umumiy proxy sozlamalari (barcha location'lar uchun bir xil sarlavhalar).
        proxy_http_version 1.1;
        proxy_set_header Host              $host;                # app host bo'yicha landing/SPA ajratadi!
        proxy_set_header X-Forwarded-For   $client_real_ip;      # real mijoz IP (yuqoridagi map)
        proxy_set_header X-Real-IP         $client_real_ip;
        proxy_set_header X-Forwarded-Proto https;                # app HTTPS ekanini bilsin (cookie Secure, CSRF)
        proxy_set_header Upgrade           $http_upgrade;        # WebSocket (SignalR negotiate ham shu yerdan o'tadi)
        proxy_set_header Connection        $connection_upgrade;

        # WEBSOCKET YO'LLARI (uzoq yashovchi ulanishlar — read timeout katta):
        #   /ws          — CTI (Local Call) Android agent WebSocket (Program.cs app.Map("/ws"))
        #   /hubs/chat   — SignalR ChatHub
        #   /hubs/live   — SignalR LiveHub
        # Keepalive'lar (SignalR 15s, CTI 30s) baribir oqib turadi, lekin 1h chegara
        # tarmoq uzilishida o'lik ulanish abadiy osilib qolmasligi uchun.
        location ~ ^/(ws|hubs/) {
            set $upstream_app http://app:8080;
            proxy_pass $upstream_app;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        # Qolgan hamma narsa (API, SPA, landing, /uploads, kamera HLS proksi va h.k.).
        location / {
            set $upstream_app http://app:8080;
            proxy_pass $upstream_app;
            proxy_connect_timeout 5s;
            proxy_read_timeout    300s;   # AI tahlil kabi sekin endpointlar uchun zaxira
            proxy_send_timeout    300s;
        }
    }
}
